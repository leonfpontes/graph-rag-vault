# The world of Tarnwick Cycles, a fictional bicycle maker. Every person, customer, supplier and place
# here is invented. This file is the source of truth of the example vault: every note in vault/ is
# rendered from one entry below (pnpm --filter @graph-rag/vault generate), and a test fails when the
# two disagree. Some notes are stale or contradict a newer one on purpose: the search has to cope.
company: Tarnwick Cycles
