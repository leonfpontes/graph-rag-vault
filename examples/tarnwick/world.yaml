projects:
  - id: prj-ridgeline-emtb
    title: Ridgeline e-MTB
    aliases: [Ridgeline, RL-1]
    created: 2025-11-03
    updated: 2026-10-09
    status: active
    owner: per-tomas-lindqvist
    body: |
      ## Summary
      A full-suspension electric mountain bike with 150 mm of travel and a mid-drive motor, for a
      spring 2027 launch. The first Tarnwick bike built for trails rather than roads.

      ## Status
      The second prototype round ended in September. Battery integration is the open risk; the cell
      choice is recorded in [[dec-switch-battery-voltaro|the October decision]] and the pack in
      [[doc-battery-spec-v3|the battery spec]].

  - id: prj-commuter-2027
    title: Commuter 2027 frame
    aliases: [C27]
    created: 2026-06-15
    updated: 2026-07-02
    status: active
    owner: per-maya-okafor
    body: |
      ## Summary
      A new frame for the commuter range from the 2027 model year: lower step-over, integrated rear
      rack mounts and room for 45 mm tyres.

      ## Plan
      Prototype frames in August, series production from January 2027. Frames will be welded in our
      own frame shop in Tarnwick, as all commuter frames have been since 2015.

  - id: prj-dealer-portal
    title: Dealer portal
    created: 2025-10-06
    updated: 2026-06-03
    status: paused
    owner: per-jonah-whitfield
    body: |
      ## Summary
      A website where dealers order bikes and parts, see delivery dates and download marketing
      material. Paused in June 2026, see [[dec-pause-dealer-portal|the decision]].

  - id: prj-warranty-flow
    title: Warranty claims flow
    created: 2025-09-01
    updated: 2026-04-14
    status: active
    owner: per-lena-nyberg
    body: |
      ## Summary
      Dealers file warranty claims on a web form instead of by e-mail. A claim for a cracked frame
      within the five-year frame warranty goes straight to [[per-kofi-mensah|quality]] with photos.

      ## Status
      Live for dealers in the UK and Germany since April 2026. Average time to a decision fell from
      nine days to four.

  - id: prj-cargo-longtail
    title: Cargo Longtail
    aliases: [Longtail]
    created: 2026-02-02
    updated: 2026-09-01
    status: active
    owner: per-tomas-lindqvist
    body: |
      ## Summary
      An electric longtail cargo bike that carries two children or 60 kg of shopping. Shares the
      drive unit with the Ridgeline but has its own frame.

  - id: prj-gravel-gx
    title: Gravel GX
    aliases: [GX]
    created: 2025-04-07
    updated: 2026-05-19
    status: done
    owner: per-ines-castell
    body: |
      ## Summary
      The steel gravel bike launched in March 2026. Sold out its first batch of 400 in seven weeks.

  - id: prj-nordic-dealers
    title: Nordic dealer expansion
    created: 2026-01-19
    updated: 2026-09-12
    status: active
    owner: per-jonah-whitfield
    body: |
      ## Summary
      Sign five dealers in Sweden and Norway by the end of 2026. Two have signed so far:
      [[cus-velo-lund|Velo Lund]] and [[cus-fjord-rides|Fjord Rides]].

      ## Open questions
      Shipping from a warehouse in Gothenburg or direct from Tarnwick; who trains the mechanics.

