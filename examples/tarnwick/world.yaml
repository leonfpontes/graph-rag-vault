people:
  - id: per-elena-brandt
    title: Elena Brandt
    aliases: [Elena, EB]
    role: CEO
    created: 2015-03-02
    updated: 2026-07-30
    status: active
    body: |
      ## Summary
      Founded Tarnwick Cycles in 2015 after ten years building frames for other brands. Chairs the
      monthly leadership meeting and signs off anything above the annual plan.

      ## Focus for 2026
      Grow the e-bike range without losing the dealers who sell the commuter bikes, and open the
      Nordic market through a small number of strong shops.

