decisions:
  - id: dec-keep-ampcore
    title: Keep Ampcore as battery supplier
    created: 2026-03-17
    status: superseded
    owner: per-priya-raman
    decided_in: mtg-2026-03-17-supply-review
    body: |
      ## Decision
      Ampcore stays the battery cell supplier for the Ridgeline and the 2027 model year.

      ## Why
      On-time delivery all winter and the best price per cell, even after a 4% increase.

  - id: dec-switch-battery-voltaro
    title: Switch Ridgeline battery cells to Voltaro
    created: 2026-10-02
    status: current
    owner: per-priya-raman
    decided_in: mtg-2026-10-02-supply-review
    supersedes: [dec-keep-ampcore]
    body: |
      ## Decision
      From January 2027 the Ridgeline packs use Voltaro cells. Ampcore keeps the cargo bike packs
      until its contract ends.

      ## Why
      Ampcore's twelve-week delay would have moved the [[prj-ridgeline-emtb|Ridgeline]] launch, and
      the Voltaro cells passed every lab test.

  - id: dec-aluminium-6061
    title: Commuter 2027 frame in 6061 aluminium
    created: 2026-09-12
    status: current
    owner: per-maya-okafor
    decided_in: mtg-2026-09-12-c27-kickoff
    body: |
      ## Decision
      The [[prj-commuter-2027|C27]] frame is made of 6061 aluminium, heat-treated after joining.

      ## Why
      Lighter than our steel frames by 600 g and cheaper to paint. Steel stays on the Gravel GX.

  - id: dec-weld-c27-in-house
    title: Weld the Commuter 2027 frames in-house
    created: 2026-06-30
    status: current
    owner: per-hiro-sato
    decided_in: mtg-2026-06-30-frame-review
    body: |
      ## Decision
      The Commuter 2027 frames are welded in our frame shop in Tarnwick, on two of the six jigs, from
      January 2027.

      ## Why
      We keep control of quality, and the old commuter frame frees the jigs in December.

  - id: dec-c27-joining-calvane
    title: Calvane takes over C27 tube joining from January
    created: 2026-10-20
    status: current
    owner: per-hiro-sato
    decided_in: mtg-2026-10-20-ops-sync
    supersedes: [dec-weld-c27-in-house]
    body: |
      ## Decision
      From January 2027 the tubes of the C27 are joined by Calvane Tubeworks, our contract partner
      in Porto. Tarnwick keeps heat treatment, paint and final assembly.

      ## Why
      The jig line has no room until March, and the partner's unit cost is within 3% of ours.

  - id: dec-lifetime-frame-cover
    title: Lifetime structural cover for first owners
    created: 2026-08-28
    status: current
    owner: per-maya-okafor
    decided_in: mtg-2026-08-28-leadership
    supersedes: [doc-warranty-terms]
    body: |
      ## Decision
      From 1 September 2026, the chassis of every bike bought from us is covered against structural
      failure for the whole time its first owner keeps it. Paint, bearings and electrics keep their
      current terms.

      ## Why
      Structural failures are rare and cheap to cover, and the promise sets us apart in the shops.

  - id: dec-pause-dealer-portal
    title: Pause the dealer portal
    created: 2026-06-03
    status: current
    owner: per-jonah-whitfield
    body: |
      ## Decision
      Stop work on the [[prj-dealer-portal|dealer portal]] until the Ridgeline has launched.

      ## Why
      Dealers would rather have the e-MTB sooner, and the same two people work on both.

  # ---- filler ----

  - id: dec-drop-the-16-inch-option-from-kids-20
    title: Drop the 16-inch option from Kids 20
    created: 2026-05-29
    status: current
    owner: per-ines-castell
    decided_in: mtg-2026-05-29-product-review
    body: |
      ## Decision
      The Kids 20 ships in one size only. Part of [[prj-kids-20|Kids 20 inch]].

      ## Why
      Two sizes doubled the tooling cost for a few hundred bikes.

  - id: dec-kids-20-gets-a-single-gear
    title: Kids 20 gets a single gear
    created: 2026-10-07
    status: current
    owner: per-ines-castell
    decided_in: mtg-2026-10-07-product-review
    body: |
      ## Decision
      No derailleur on the Kids 20: one gear and a chain guard. Part of [[prj-kids-20|Kids 20 inch]].

      ## Why
      Parents asked for less maintenance; it saves 400 g.

  - id: dec-replace-levers-on-all-affected-commuter-bike
    title: Replace levers on all affected commuter bikes
    created: 2026-07-13
    status: current
    owner: per-kofi-mensah
    decided_in: mtg-2026-07-13-quality-review
    body: |
      ## Decision
      Every commuter bike built between October and December 2025 gets new levers, fitted by the dealer. Part of [[prj-brake-lever-recall|Brake lever recall 2026]].

      ## Why
      A recall of the whole batch is simpler than testing each lever.

  - id: dec-pay-dealers-a-flat-fee-per-lever-swap
    title: Pay dealers a flat fee per lever swap
    created: 2026-05-11
    status: current
    owner: per-oskar-farrow
    decided_in: mtg-2026-05-11-finance-review
    body: |
      ## Decision
      Dealers get £25 or €28 per bike for the lever swap. Part of [[prj-brake-lever-recall|Brake lever recall 2026]].

      ## Why
      A flat fee is quicker to pay than hourly claims.

  - id: dec-buy-a-second-curing-oven
    title: Buy a second curing oven
    created: 2026-08-27
    status: current
    owner: per-hiro-sato
    decided_in: mtg-2026-08-27-operations-weekly
    body: |
      ## Decision
      We buy a second curing oven for the paint line. Part of [[prj-paint-line-upgrade|Paint line upgrade]].

      ## Why
      Colour changes cost us half a shift every week.

  - id: dec-install-the-oven-in-the-october-shutdown
    title: Install the oven in the October shutdown
    created: 2026-08-27
    status: superseded
    owner: per-hiro-sato
    decided_in: mtg-2026-08-27-operations-weekly
    body: |
      ## Decision
      The oven goes in during the one-week October shutdown. Part of [[prj-paint-line-upgrade|Paint line upgrade]].

      ## Why
      No lost production days.

  - id: dec-move-the-oven-install-to-the-december-shutdo
    title: Move the oven install to the December shutdown
    created: 2026-11-13
    status: current
    owner: per-hiro-sato
    decided_in: mtg-2026-11-13-quality-review
    supersedes: [dec-install-the-oven-in-the-october-shutdown]
    body: |
      ## Decision
      The oven goes in during the December shutdown instead. Part of [[prj-paint-line-upgrade|Paint line upgrade]].

      ## Why
      The supplier cannot deliver before November.

  - id: dec-pause-the-fit-studio
    title: Pause the fit studio
    created: 2025-12-19
    status: current
    owner: per-wren-galloway
    decided_in: mtg-2025-12-19-marketing-planning
    body: |
      ## Decision
      Stop the fit studio until the trade show is over. Part of [[prj-fit-studio|Fit studio]].

      ## Why
      The same room is needed for the trade show bikes.

  - id: dec-rear-rack-v2-rated-for-27-kg
    title: Rear rack v2 rated for 27 kg
    created: 2026-05-29
    status: current
    owner: per-ines-castell
    decided_in: mtg-2026-05-29-product-review
    body: |
      ## Decision
      The new rack is rated for 27 kg and takes a child seat. Part of [[prj-rear-rack-v2|Rear rack v2]].

      ## Why
      Dealers lose sales to cargo bikes because of the old 20 kg limit.

  - id: dec-rack-v2-made-by-our-current-rack-supplier
    title: Rack v2 made by our current rack supplier
    created: 2026-08-27
    status: current
    owner: per-priya-raman
    decided_in: mtg-2026-08-27-operations-weekly
    body: |
      ## Decision
      The rack stays with the current supplier on new tooling. Part of [[prj-rear-rack-v2|Rear rack v2]].

      ## Why
      They hold the tooling and the price was the best of three quotes.

  - id: dec-book-a-60-square-metre-stand
    title: Book a 60 square metre stand
    created: 2026-08-09
    status: current
    owner: per-wren-galloway
    decided_in: mtg-2026-08-09-marketing-planning
    body: |
      ## Decision
      We take a 60 square metre stand in hall B. Part of [[prj-trade-show-2027|Trade show 2027]].

      ## Why
      Big enough for a short test track.

  - id: dec-book-a-90-square-metre-stand
    title: Book a 90 square metre stand
    created: 2026-11-18
    status: current
    owner: per-wren-galloway
    decided_in: mtg-2026-11-18-marketing-planning
    supersedes: [dec-book-a-60-square-metre-stand]
    body: |
      ## Decision
      We take a 90 square metre corner stand in hall B instead. Part of [[prj-trade-show-2027|Trade show 2027]].

      ## Why
      The Ridgeline launch needs room for a proper test track.

  - id: dec-train-dealer-mechanics-at-the-factory
    title: Train dealer mechanics at the factory
    created: 2026-05-29
    status: current
    owner: per-femi-rowe
    decided_in: mtg-2026-05-29-product-review
    body: |
      ## Decision
      The first course of each season runs at the factory, the rest online. Part of [[prj-dealer-training|Dealer training programme]].

      ## Why
      Mechanics learn more with the bikes in front of them.

  - id: dec-charge-dealers-for-the-second-course
    title: Charge dealers for the second course
    created: 2026-09-22
    status: current
    owner: per-oskar-farrow
    decided_in: mtg-2026-09-22-finance-review
    body: |
      ## Decision
      The first course is free for each dealer; further places cost €150. Part of [[prj-dealer-training|Dealer training programme]].

      ## Why
      Free places were booked and then not used.

  - id: dec-boxes-without-plastic-foam
    title: Boxes without plastic foam
    created: 2026-08-27
    status: current
    owner: per-uma-sethi
    decided_in: mtg-2026-08-27-operations-weekly
    body: |
      ## Decision
      From the 2027 model year bikes ship in boxes with paper padding only. Part of [[prj-packaging-redesign|Packaging redesign]].

      ## Why
      Dealers pay to dispose of foam, and riders complain about it.

  - id: dec-ship-bikes-with-the-bars-turned
    title: Ship bikes with the bars turned
    created: 2026-08-27
    status: current
    owner: per-uma-sethi
    decided_in: mtg-2026-08-27-operations-weekly
    body: |
      ## Decision
      Bikes ship with the handlebar turned, not removed. Part of [[prj-packaging-redesign|Packaging redesign]].

      ## Why
      Dealers save fifteen minutes per bike.

  - id: dec-go-live-with-the-new-erp-in-february
    title: Go live with the new ERP in February
    created: 2026-05-11
    status: current
    owner: per-oskar-farrow
    decided_in: mtg-2026-05-11-finance-review
    body: |
      ## Decision
      The new ERP goes live on 1 February 2027. Part of [[prj-erp-migration|ERP migration]].

      ## Why
      After the year-end close and before the spring orders.

  - id: dec-go-live-with-the-new-erp-in-april
    title: Go live with the new ERP in April
    created: 2026-09-22
    status: current
    owner: per-oskar-farrow
    decided_in: mtg-2026-09-22-finance-review
    supersedes: [dec-go-live-with-the-new-erp-in-february]
    body: |
      ## Decision
      The new ERP goes live on 6 April 2027 instead. Part of [[prj-erp-migration|ERP migration]].

      ## Why
      The data migration test found too many duplicate parts.

  - id: dec-monthly-order-cut-off-on-the-first-monday
    title: Monthly order cut-off on the first Monday
    created: 2025-04-11
    status: current
    owner: per-jonah-whitfield
    decided_in: mtg-2025-04-11-sales-weekly
    body: |
      ## Decision
      Dealer orders close on the first Monday of each month.

      ## Why
      One cut-off makes the build plan stable.

  - id: dec-two-order-cut-offs-per-month
    title: Two order cut-offs per month
    created: 2025-10-11
    status: current
    owner: per-jonah-whitfield
    decided_in: mtg-2025-10-11-sales-weekly
    supersedes: [dec-monthly-order-cut-off-on-the-first-monday]
    body: |
      ## Decision
      Dealer orders close on the first and the third Monday of each month.

      ## Why
      Dealers waited too long for small top-up orders.

  - id: dec-second-source-for-chromoly-tubing
    title: Second source for chromoly tubing
    created: 2025-04-26
    status: current
    owner: per-priya-raman
    decided_in: mtg-2025-04-26-operations-weekly
    body: |
      ## Decision
      We qualify a second supplier for chromoly tubing.

      ## Why
      One supplier for the Gravel GX tubes is too great a risk.

  - id: dec-catalogue-printed-on-recycled-paper
    title: Catalogue printed on recycled paper
    created: 2025-04-12
    status: current
    owner: per-wren-galloway
    decided_in: mtg-2025-04-12-marketing-planning
    body: |
      ## Decision
      The 2027 catalogue is printed on recycled paper, 20% fewer pages.

      ## Why
      Cheaper and dealers keep the website open anyway.

  - id: dec-four-day-week-for-the-paint-line-in-january
    title: Four-day week for the paint line in January
    created: 2025-06-23
    status: current
    owner: per-hiro-sato
    decided_in: mtg-2025-06-23-operations-weekly
    body: |
      ## Decision
      The paint line works four days a week in January.

      ## Why
      January demand is always low.

  - id: dec-free-first-service-after-500-km
    title: Free first service after 500 km
    created: 2025-03-13
    status: current
    owner: per-lena-nyberg
    decided_in: mtg-2025-03-13-product-review
    body: |
      ## Decision
      Every new bike gets a free first service at the dealer after 500 km.

      ## Why
      Riders who come back for a service buy their next bike from us.

  - id: dec-hire-two-apprentices-for-the-plant
    title: Hire two apprentices for the plant
    created: 2025-11-06
    status: current
    owner: per-hiro-sato
    decided_in: mtg-2025-11-06-operations-weekly
    body: |
      ## Decision
      Two apprentices start in September, one in assembly and one in the paint line.

      ## Why
      Half of the plant team retires within ten years.

  - id: dec-move-the-dealer-newsletter-to-monthly
    title: Move the dealer newsletter to monthly
    created: 2025-06-11
    status: current
    owner: per-wren-galloway
    decided_in: mtg-2025-06-11-marketing-planning
    body: |
      ## Decision
      The dealer newsletter goes out once a month instead of every week.

      ## Why
      Open rates fell below 20%.

documents:
  - id: doc-battery-spec-v2
    title: Ridgeline battery spec v2
    created: 2026-02-10
    status: outdated
    owner: per-tomas-lindqvist
    body: |
      ## Pack
      720 Wh pack of 21700 cells from Ampcore, 13 in series and 4 in parallel, in a cast magnesium
      case inside the down tube.

      ## Charging
      4 A charger, full in five hours.

  - id: doc-battery-spec-v3
    title: Ridgeline battery spec v3
    created: 2026-09-30
    status: current
    owner: per-tomas-lindqvist
    supersedes: [doc-battery-spec-v2]
    body: |
      ## Pack
      750 Wh pack of 21700 Voltaro cells, 13 in series and 4 in parallel, same case as v2. See
      [[dec-switch-battery-voltaro|the cell decision]].

      ## Charging
      5 A charger, full in four hours.

  - id: doc-cell-test-report
    title: Voltaro cell test report
    created: 2026-09-24
    status: final
    owner: per-kofi-mensah
    body: |
      ## Result
      Forty cells cycled 800 times at 25 °C and 45 °C: capacity loss under 9%, no swelling, no
      thermal events. Passed the crush and nail tests.

  - id: doc-ampcore-supply-agreement
    title: Ampcore supply agreement
    created: 2025-04-01
    updated: 2026-03-20
    status: active
    owner: per-priya-raman
    body: |
      ## Terms
      Ampcore supplies 21700 battery cells for Tarnwick e-bikes until 31 March 2027, with prices
      fixed per quarter and ten weeks of lead time.

  - id: doc-warranty-terms
    title: Warranty terms
    created: 2024-02-01
    status: current
    owner: per-lena-nyberg
    body: |
      ## Frames
      Tarnwick frames carry a five-year warranty against manufacturing defects, for the first owner,
      from the date of purchase.

      ## Other parts
      Two years on components, paint and electrics.

  - id: doc-dealer-handbook-2025
    title: Dealer handbook 2025
    created: 2025-01-15
    status: current
    owner: per-jonah-whitfield
    body: |
      ## Ordering
      Orders close on the first Monday of each month; bikes ship within three weeks.

      ## Warranty
      Five years on the frame and two years on everything else. File claims with photos.

  - id: doc-service-faq
    title: Service FAQ for riders
    created: 2025-05-20
    status: current
    owner: per-lena-nyberg
    body: |
      ## How long is the frame warranty?
      Five years from the date you bought the bike, if you are its first owner.

      ## Where do I get my bike serviced?
      At any Tarnwick dealer; the first service after 500 km is free.

  - id: doc-c27-frame-spec
    title: C27 frame spec
    created: 2026-07-10
    status: draft
    owner: per-ines-castell
    body: |
      ## Construction
      TIG-welded aluminium tubes, welded in the Tarnwick frame shop on jig 4 and jig 5.

      ## Fit
      Step-over 380 mm on the medium size; rack mounts rated for 25 kg.

  - id: doc-frame-shop-capacity-plan
    title: Frame shop capacity plan 2027
    created: 2026-07-22
    status: current
    owner: per-greta-hale
    body: |
      ## Plan
      Welding hours per week by frame for 2027: Commuter 2027 frame 160 hours on two jigs, Cargo
      Longtail 120 hours, spare frames 40 hours.

  - id: doc-pricing-sheet-2026
    title: Price list 2026
    created: 2026-01-12
    updated: 2026-05-04
    status: current
    owner: per-oskar-farrow
    body: |
      ## Retail prices
      UK and Germany only. Gravel GX: £2,450 / €2,790. Commuter: £1,390 / €1,590. Cargo Longtail:
      £4,900 / €5,490 from autumn. Ridgeline: target £5,400 / €5,990 at launch.

  - id: doc-field-test-autumn-2026
    title: Field test notes, autumn 2026
    created: 2026-10-05
    status: final
    owner: per-yara-dunmore
    body: |
      ## Riders
      Twelve outside riders, three weeks on the [[prj-ridgeline-emtb|e-MTB prototype]].

      ## Complaints
      A creak from the rear shock bushing after wet rides, and a display that is hard to read in
      low sun. Range was praised by everyone.

  - id: doc-nordic-expansion-memo
    title: Nordic expansion memo
    created: 2026-04-02
    status: current
    owner: per-jonah-whitfield
    body: |
      ## Plan
      Dealers in Sweden and Norway order in euros and collect from a Gothenburg warehouse.
      Mechanics are trained in Tarnwick in their first season.

  # ---- filler ----

  - id: doc-torque-spec-gravel-gx
    title: Torque spec, Gravel GX
    created: 2026-08-08
    updated: 2026-09-05
    status: current
    owner: per-femi-rowe
    body: |
      ## Content
      Stem bolts 5 Nm, seat post clamp 6 Nm, thru-axles 12 Nm, disc rotor bolts 6 Nm. Use a torque wrench on carbon parts.

  - id: doc-packaging-guide
    title: Packaging guide
    created: 2026-09-10
    updated: 2026-09-10
    status: current
