    status: active
    reports_to: per-elena-brandt
    body: |
      ## Summary
      Runs the product team: industrial design, the e-bike engineers and customer service. Owns the
      roadmap and the [[prj-commuter-2027|Commuter 2027 frame]].

      ## How she works
