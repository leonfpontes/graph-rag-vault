<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Graph RAG over a Markdown vault: hybrid search over a knowledge graph, answers that cite their notes, and an evaluation of what the graph adds."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Graph RAG over a Markdown vault</title>
    <script>
      // The theme before the first paint: ?dark / ?theme=, then the system.
      try {
        var q = new URLSearchParams(location.search)
        var dark = q.has('dark') || q.get('theme') === 'dark'
        var light = q.has('light') || q.get('theme') === 'light'
        if (dark || (!light && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
