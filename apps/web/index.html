  <head>

    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:site_name" content="graph-rag-vault" />
    <meta property="og:title" content="Graph RAG over a Markdown vault" />
    <meta
      property="og:description"
      content="Hybrid search over a knowledge graph of notes, answers that cite their notes, and an evaluation of what the graph adds."
    />

      content="graph-rag-vault: a question, its cited answer, the path through the graph and the scoreboard sentence."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />
    <script>
      // The theme before the first paint: ?dark / ?light / ?theme=, then the last choice, then the system.
      try {
        var q = new URLSearchParams(location.search)
        var saved = null
        try {
          saved = localStorage.getItem('graph-rag-vault:theme')
        } catch (e) {}
        var dark = q.has('dark') || q.get('theme') === 'dark'
        var light = q.has('light') || q.get('theme') === 'light'
        if (!dark && !light) {
          dark = saved === 'dark'
          light = saved === 'light'
        }
        if (dark || (!light && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
