packages:
  - packages/*
  - apps/*
  - evals

# One React in the whole repository: two copies break hooks when Radix resolves another React.
overrides:
  react: 19.3.1
  react-dom: 19.3.1

allowBuilds:
  esbuild: false # its postinstall only re-checks the platform binary, which comes as an optional dependency
  onnxruntime-node: false # the CPU binaries ship in the package; its postinstall only downloads CUDA libraries on linux/x64
  protobufjs: false # its postinstall only warns about the version scheme of dependents

minimumReleaseAgeExclude:
  - '@leonfpontes/atlas-tokens@0.3.0'
  - '@leonfpontes/atlas-ui@0.3.0'
