# Evaluation questions about the Tarnwick vault (examples/tarnwick). Each question has the notes a
# good answer must come from (`expectedSources`) and the traps that make it hard for a search that only
# compares embeddings. evals/src/questions.test.ts proves every trap from the vault itself.
#
# Trap kinds:
# - bridge: the answer is reached from a note the question names by following typed links; the notes
#   in between (the bridge) and the answer are not named in the question.
# - supersedes: a newer note replaces an older one; with `vocabulary: other` it shares fewer words
#   with the question than the note it replaces.
# - alias: the question names a note only by one of its aliases.
# - neighbour: an unanswerable question about a topic the vault does cover, without the fact asked.
# - newest: several notes answer it at different dates, with no link between them; the newest wins.
#
# `evidence` names text that must be in an expected source: the answer is really in the notes.
# Splits: `probe` and `dev` (10 questions) may tune the search; `test` (40) makes the scoreboard and
# is never used for tuning. The test questions were written from these rules and the world, without
# looking at what any search returns for them.
#
# The probe split calibrates the difficulty of the set before the full set is written.
questions:
  - id: q-001
    kind: multi-hop
    split: probe
    question: Which dealer joined the meeting where the C27 frame material was chosen?
    expectedSources: [dec-aluminium-6061, mtg-2026-09-12-c27-kickoff, cus-velo-lund]
    evidence:
      - { note: cus-velo-lund, contains: 'Velo Lund' }
    traps:
      - kind: bridge
        from: dec-aluminium-6061
        path:
          - { relation: decided_in, to: mtg-2026-09-12-c27-kickoff }
          - { relation: customer, to: cus-velo-lund }

  - id: q-002
    kind: multi-hop
    split: probe
    question: Who does the owner of RL-1 report to?
    expectedSources: [prj-ridgeline-emtb, per-tomas-lindqvist, per-maya-okafor]
    evidence:
      - { note: per-maya-okafor, contains: 'Maya Okafor' }
    traps:
      - kind: alias
        note: prj-ridgeline-emtb
        alias: RL-1
      - kind: bridge
        from: prj-ridgeline-emtb
        path:
          - { relation: owner, to: per-tomas-lindqvist }
          - { relation: reports_to, to: per-maya-okafor }

  - id: q-003
